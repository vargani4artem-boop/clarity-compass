<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Компас Ясности · Clarity Compass</title>
<meta name="description" content="Интерактивная AI-экосистема: бесплатный AI-опросник за 2 минуты, заочный курс с AI-супервайзером проверки заданий и мобильный пульт владельца." />
<meta property="og:title" content="Компас Ясности · AI-экосистема (Демо)" />
<meta property="og:description" content="3 модуля в одном приложении: 1) AI-опросник клиента, 2) AI-супервайзер курса с автодопродажей VIP, 3) Пульт владельца на телефоне." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#142e31;
  --muted:#486568;
  --green:#116851;
  --green-hover:#0d5442;
  --mint:#e5f5ed;
  --line:#dce8e5;
  --paper:#ffffff;
  --bg:#f6f9f8;
  --coral:#9b3b32;
  --coral-accent:#d57967;
  --peach:#fff0e9;
  --peach-line:#efd6cd;
  --amber-bg:#fff3dc;
  --amber-ink:#755020;
  --amber-line:#efdfbb;
  --yellow-bg:#fff6e2;
  --yellow-line:#f0dfb6;
  --radius:24px;
  --shadow:0 8px 26px rgba(24, 61, 53, 0.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15.5px/1.52 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button,select,summary{cursor:pointer}
button{border:0}
button:disabled{cursor:default;opacity:.46}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:3px solid #3682b5;
  outline-offset:3px;
}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.15;letter-spacing:-.03em}
h1{font-size:clamp(27px, 4.8vw, 52px);font-weight:750}
h2{font-size:clamp(20px, 2.4vw, 24px);font-weight:750}
h3{font-size:17.5px;font-weight:750}
p,small{color:var(--muted)}
small{font-size:13px}

.shell{width:min(100% - 32px, 1120px);margin:auto}

/* Sticky Nordic Topbar */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(246, 249, 248, 0.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brandbar{
  min-height:66px;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-click{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  padding:0;
  text-align:left;
}
.logo,.icon{display:grid;place-items:center;flex:none}
.logo{
  width:39px;
  height:39px;
  border-radius:13px;
  background:#145745;
  color:#fff;
  font-size:23px;
}
.brandbar strong,.brandbar small{display:block}
.brandbar strong{line-height:1.15;font-size:16px;font-weight:800;color:var(--ink)}
.brandbar small{font-size:12.5px;color:var(--muted)}

.lang{
  margin-left:auto;
  display:flex;
  padding:3px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#eef4f2;
}
.lang button{
  background:transparent;
  min-height:36px;
  padding:0 10px;
  font-size:12px;
  font-weight:750;
  border-radius:9px;
  color:var(--muted);
  transition:all .16s ease;
}
.lang .on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,46,49,.08)}

nav{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  background:#eaf0ee;
  border-radius:15px;
  padding:4px;
  margin-bottom:12px;
  gap:4px;
}
nav button{
  background:none;
  border-radius:11px;
  min-height:43px;
  padding:4px 4px;
  font-weight:700;
  font-size:clamp(11.5px, 3vw, 14px);
  white-space:nowrap;
  color:var(--muted);
  transition:all .18s ease;
}
nav button:hover{color:var(--ink)}
nav .on{
  background:#fff;
  box-shadow:0 2px 8px rgba(21,53,44,.09);
  color:var(--green);
}
.count{
  display:inline-grid;
  place-items:center;
  background:#aa4437;
  color:#fff;
  border-radius:20px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  font-size:10.5px;
  font-weight:800;
  margin-left:4px;
  vertical-align:middle;
}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.count.pulse{animation:pop .5s ease 2}

main{padding:20px 0 56px}
.stack{display:grid;gap:16px}

/* Serene Mint-Sky Hero + Geometric Compass */
.hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:26px 22px;
  border-radius:28px;
  background:linear-gradient(117deg, #e9f8ee, #dff3f8 72%, #c9e8ee);
  border:1px solid #cfe9e4;
}
.hero h1{max-width:690px;margin:12px 0 10px;color:var(--ink)}
.hero p{max-width:560px;color:#35565a;font-size:15px}
.hero.intro{padding-top:144px}

.compass{
  width:152px;
  aspect-ratio:1;
  position:absolute;
  right:24px;
  top:-18px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg, #346f6e50 0deg 1deg, transparent 1deg 15deg),
    linear-gradient(145deg, #ffffff, #a8dcd6);
  box-shadow:0 10px 22px #30716a24, inset 0 0 0 6px #ffffff88;
  transform:rotate(-12deg);
}
.compass:before{
  content:'';
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%, #fbffff, #ceebe6);
  border:1px solid #fff;
}
.needle{
  z-index:1;
  width:30%;
  height:72%;
  transform:rotate(40deg);
  background:linear-gradient(#16795f 50%, #77b4bd 50%);
  clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.compass:after{
  content:'';
  position:absolute;
  z-index:2;
  width:9%;
  height:9%;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 6px #173e45aa;
}

/* Badges / Tags (high contrast on BOTH hero AND white cards!) */
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  width:fit-content;
  max-width:100%;
  border-radius:999px;
  background:#e9f4f1;
  color:#1f5548;
  padding:5px 11px;
  font-size:12px;
  font-weight:750;
  overflow-wrap:anywhere;
}
.hero .tag{background:rgba(255,255,255,0.82);color:#1f5548}
.tag.vaidile{background:#e3f5ec;color:#116851}
.tag.tatiana{background:#fff3dc;color:#755020}
.tag.hot-tag{background:#fae6e0;color:var(--coral)}
.tag.new-tag{background:#e2f2fb;color:#1d5f86}
.tag.course-tag{background:#edf2fb;color:#3d4d8a}

/* 4-Segment Step Bar */
.stepbar{display:grid;gap:8px;padding:0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.segments{display:flex;gap:6px}
.segments i,.meter{height:6px;border-radius:12px;background:#dceae5;overflow:hidden}
.segments i{flex:1;transition:background .3s ease}
.segments .filled,.meter i{background:#319779}
.meter{width:100%}
.meter i{height:100%;display:block;border-radius:inherit;transition:width .4s ease}

/* Cards & Grids */
.grid{display:grid;gap:11px}
.choice,.card{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.choice{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:88px;
  text-align:left;
  padding:14px 15px;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.choice:hover,.option:hover,.check-row:hover{border-color:#72ab9a}
.choice:hover{transform:translateY(-2px)}
.choice .arrow{margin-left:auto;color:#3f695e;font-size:17px;flex:none}
.choice strong{display:block;font-size:15.5px;font-weight:750;color:var(--ink);margin-bottom:2px}
.choice small{display:block;font-size:13px;line-height:1.4}

.icon{
  height:44px;
  width:44px;
  border-radius:14px;
  background:#e3f3ee;
  color:#14664e;
  font-size:21px;
}
.icon.blue{background:#e8f3ff;color:#285f87}
.icon.rose{background:#faeaf1;color:#883f62}
.icon.amber{background:#fff3dc;color:#755020}
.choice.warm{background:linear-gradient(135deg, #fffdf8, #fff6e2);border-color:var(--amber-line)}

.card{padding:19px;min-width:0}
.card>*+*{margin-top:12px}
.card p,.card li{overflow-wrap:anywhere}
.card.green{background:#e6f6ed;border-color:#c5e7d7}
.card.green p,.card.green li{color:#1f4d3d}
.card.peach{background:var(--peach);border-color:var(--peach-line)}
.card.peach p{color:#5e352d}
.card.yellow{background:var(--yellow-bg);border-color:var(--yellow-line)}
.card.yellow p,.card.yellow li{color:#5d441b}

/* Buttons */
.primary,.secondary,.option{
  border-radius:14px;
  min-height:48px;
  padding:11px 16px;
  font-weight:700;
  transition:all .16s ease;
}
.primary{background:var(--green);color:#fff;width:100%}
.primary:hover:not(:disabled){background:var(--green-hover)}
.primary.coral-btn{background:#b8493b}
.primary.coral-btn:hover:not(:disabled){background:#9c3b2f}
.secondary,.option{background:#f1f7f4;border:1px solid var(--line);color:var(--ink)}
.secondary:hover:not(:disabled){background:#e6f2ec}
.option{text-align:left;line-height:1.38}
.option.on{background:#dff3e8;border-color:#5fa389;color:#0e4737}

.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions>*{flex:1;min-width:140px}
.back{width:fit-content}

/* Checkboxes (Priority Selection) */
.check-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:48px;
  padding:10px 13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#f8fbfa;
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;
}
.check-row.on{background:#e4f5ec;border-color:#68ab92}
.check-row.dis{opacity:.48;cursor:not-allowed}
.check-row input{width:19px;height:19px;accent-color:var(--green);flex:none;margin:0;cursor:inherit}
.check-row span{font-size:14.5px;font-weight:600;color:var(--ink)}

/* Forms */
.form{display:grid;gap:11px}
label.field{display:grid;gap:5px;font-weight:700;font-size:13.5px;color:var(--ink)}
input.inp,textarea.inp,select.inp{
  width:100%;
  min-width:0;
  border:1px solid #bed2ce;
  border-radius:12px;
  background:#fff;
  padding:10px 13px;
  min-height:46px;
}
textarea.inp{resize:vertical;min-height:106px;line-height:1.5}
.form-two{display:grid;gap:10px}

/* Analyzing Spinner */
.analyzing{text-align:center;padding:34px 18px}
.spin{
  width:46px;
  height:46px;
  border-radius:50%;
  border:3.5px solid #d5e8e2;
  border-top-color:var(--green);
  margin:0 auto 16px;
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}
.an-steps{
  max-width:340px;
  margin:14px auto 0;
  text-align:left;
  display:grid;
  gap:8px;
  font-size:13.8px;
  color:var(--muted);
}
.an-steps .done{color:var(--green);font-weight:700}

/* Result Pillars & Blurred Preview */
.tags{display:flex;gap:6px;flex-wrap:wrap}
.values,.track{
  display:grid;
  gap:7px;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  text-align:center;
}
.values div{
  padding:12px 10px;
  border-radius:16px;
  background:#ebf5f1;
  border:1px solid #d3e8df;
}
.values strong{display:block;font-size:13.5px;color:var(--green);margin-bottom:2px}
.values small{display:block;font-size:12px;line-height:1.35}
@media(max-width:540px){.values{grid-template-columns:1fr;text-align:left}}

.track span{
  padding:10px 6px;
  border-radius:13px;
  background:#e6f4ee;
  border:1px solid #cde6db;
  color:#155342;
  font-size:12.2px;
  font-weight:750;
}
.track .active-step{background:#dff1f7;border-color:#b7dceb;color:#1b4f6e}
.track .locked{background:#eef1f1;border-color:var(--line);color:#5a6e70}
.track .unlocked{
  background:#dff4e8;
  border-color:#6db896;
  color:#0e523e;
  animation:unlock .45s ease-out;
}
@keyframes unlock{from{transform:scale(.9);background:#a9e9ba}}

.blur-wrap{
  position:relative;
  border-radius:16px;
  border:1px dashed #b9d2cb;
  background:#f8fbfa;
  padding:14px 16px;
  overflow:hidden;
}
.blur{filter:blur(4px);user-select:none;font-size:13.8px;line-height:1.65;color:var(--muted)}
.blur-ov{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  padding:12px;
  text-align:center;
  background:rgba(246,249,248,0.52);
  font-weight:750;
  font-size:13.5px;
  color:var(--ink);
}

/* Course 1-2-3 Visual Scheme */
.scheme{
  display:flex;
  align-items:center;
  justify-content:space-evenly;
  text-align:center;
  gap:6px;
  background:linear-gradient(120deg, #e9f6fc, #e9f6ed);
  border:1px solid #d1e8e4;
  padding:14px 10px;
  border-radius:16px;
}
.scheme .s-node{flex:1}
.scheme b{display:block;font-size:21px;color:var(--green);line-height:1.1}
.scheme strong{display:block;font-size:12.5px;color:var(--ink);margin-top:2px}
.scheme small{display:block;font-size:11px;line-height:1.3;margin-top:2px}
.scheme .s-arr{color:#5e8d82;font-weight:700;flex:none}
@media(max-width:460px){.scheme{flex-direction:column;gap:8px}.scheme .s-arr{transform:rotate(90deg)}}

.rubric-panel{
  background:#f2f8f6;
  border:1px dashed #9fc4b8;
  border-radius:15px;
  padding:13px 15px;
  font-size:13.2px;
}
.rubric-panel ul{margin:7px 0 0;padding-left:20px}
.rubric-panel li{margin-bottom:4px;color:var(--muted)}

.scen-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:7px}
@media(max-width:520px){.scen-grid{grid-template-columns:1fr}}
.scen-btn{
  border-radius:12px;
  min-height:42px;
  padding:8px 10px;
  font-size:12.6px;
  font-weight:700;
  background:#f3f8f6;
  border:1px solid var(--line);
  color:var(--ink);
  transition:all .15s;
}
.scen-btn:hover{border-color:#68ab92;background:#e6f5ee}
.scen-btn.st:hover{border-color:#d57967;background:#fff0e9;color:var(--coral)}

/* Owner Dashboard */
.kpis{grid-template-columns:repeat(2, minmax(0, 1fr))}
.kpis strong{display:block;font-size:28px;line-height:1.18;color:var(--ink);margin-top:4px}
.kpis .card{padding:14px 16px}
.kpis .kpi-hot strong{color:var(--coral)}
.kpis .kpi-green strong{color:var(--green)}

.funnel{display:grid;gap:11px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hot{border-left:4px solid var(--coral-accent);background:linear-gradient(135deg, #fffaf8 0%, #ffffff 38%)}
.fresh-card{border-left:4px solid #319779;background:linear-gradient(135deg, #f4fbf8 0%, #ffffff 42%)}
blockquote{
  margin:10px 0;
  color:var(--muted);
  border-left:2.5px solid #d6a494;
  padding-left:11px;
  font-size:13.8px;
  overflow-wrap:anywhere;
}
details summary{font-weight:700;font-size:13.8px;color:var(--green)}
details p{margin-top:6px;font-size:13.5px}
ol,ul{padding-left:21px;margin:0}
li+li{margin-top:7px}
.break{overflow-wrap:anywhere}
.foot{
  text-align:center;
  font-size:12.5px;
  color:var(--muted);
  padding:14px 10px 0;
  border-top:1px solid var(--line);
}
.visually-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}

/* Desktop 1280px Responsive Elevation */
@media(min-width:760px){
  main{padding-top:30px}
  .brandbar{min-height:74px}
  nav{width:min(100%, 600px)}
  .hero{padding:38px 40px}
  .hero.intro{padding:46px 320px 46px 40px}
  .compass{width:224px;right:52px;top:50%;translate:0 -50%}
  .grid.two{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .choice{padding:18px 20px;min-height:102px}
  .kpis{grid-template-columns:repeat(4, minmax(0, 1fr))}
  .kpis .card,.card{padding:22px}
  .columns{grid-template-columns:1fr 1fr;align-items:start}
  .narrow{max-width:740px;width:100%;margin-inline:auto}
  .form-two{grid-template-columns:1fr 1fr}
  .primary{min-height:50px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="shell">
    <div class="brandbar">
      <button class="brand-click" data-action="home" aria-label="Компас Ясности">
        <span class="logo" aria-hidden="true">✦</span>
        <span>
          <strong id="brand">Компас Ясности</strong>
          <small id="sub">AI-экосистема • Демо</small>
        </span>
      </button>
      <div class="lang" aria-label="Language" id="lang"></div>
    </div>
    <nav id="nav" aria-label="Ecosystem Modules"></nav>
  </div>
</header>

<main class="shell" id="main"></main>
<div class="visually-hidden" role="status" id="status"></div>

<script>

const DATA = {

    back: '← Назад',
    cont: 'Продолжить →',
    qBadge: (i) => `Вопрос ${i} из 3`,
    ownLbl: 'Или напишите свой вариант',
    ownPh: 'Коротко своими словами...',
    nextQ: 'Следующий вопрос →',
    finishQ: 'Получить разбор ✦',
    anTitle: 'ИИ собирает вашу картину...',
    anSub: 'Сопоставляем приоритеты и готовим конкретный первый шаг',
    anSteps: [

    ],
    resChip: '✦ Опрос завершён · ВАУ! Теперь понятно, что делать',
    resTitle: 'Ваш персональный экспресс-разбор готов',

    rootH: 'Корень ситуации',
    step72H: 'Ваш первый шаг на 72 часа',
    pillars: [

function loadEvents() {
  try {
    const raw = localStorage.getItem('clarity_nordic_events_v3');
    if (raw) { state.events = JSON.parse(raw); return; }
  } catch (e) {}
  state.events = JSON.parse(JSON.stringify(SEED_EVENTS));
}
function saveEvents() {
  try { localStorage.setItem('clarity_nordic_events_v3', JSON.stringify(state.events)); } catch (e) {}
}

const d = () => DATA[state.lang];
const getArea = () => d().spheres.find(s => s.id === state.areaId) || d().spheres[0];

  const sp = getArea();
  if (sp.id === 'unsure') return [state.lang === 'ru' ? 'Хочу перемен, ищу фокус' : 'Ready for change, seeking clarity'];
  const list = sp.items.filter(it => state.selectedIds.includes(it.id)).map(it => it.text);
  if (state.other.trim()) list.push(state.other.trim());
  return list;
};
const computeTrack = () => {
  if (state.areaId === 'unsure') return 'tatiana';
  const sp = getArea();
  const chosen = sp.items.filter(it => state.selectedIds.includes(it.id));
  if (chosen.some(it => it.route === 'vaidile')) return 'vaidile';
  if (state.areaId === 'business') return 'business';
  return 'tatiana';
};

function render(focus = false, pulseBadge = false) {
  const L = d();
  document.documentElement.lang = state.lang;
  $('brand').textContent = L.brand;
  $('sub').textContent = L.sub;

  $('lang').innerHTML = ['ru', 'en'].map(code =>
    `<button class="${state.lang === code ? 'on' : ''}" data-action="lang:${code}" aria-pressed="${state.lang === code}">${code.toUpperCase()}</button>`
  ).join('');

  const pending = hotOpenCount();
  $('nav').innerHTML = L.tabs.map((lbl, i) => {
    const badge = i === 2 && pending ? `<span class="count ${pulseBadge ? 'pulse' : ''}" aria-label="${L.hotAria} ${pending}">${pending}</span>` : '';
    return `<button class="${state.tab === i ? 'on' : ''}" data-action="tab:${i}" aria-pressed="${state.tab === i}">${lbl}${badge}</button>`;
  }).join('');

  $('main').innerHTML = [renderQuiz, renderCourse, renderOwner][state.tab]();

  if (focus) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const h = $('main').querySelector('h1');
    if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  }
}

function renderQuiz() {
  const L = d();
  const displayStep = state.analyzing ? 3 : state.step;
  const heroHtml = state.step === 0 && !state.analyzing
    ? `<section class="hero intro">
         <div class="compass" aria-hidden="true"><i class="needle"></i></div>
         <span class="tag">${L.heroChip}</span>
         <h1>${L.heroTitle}</h1>
         <p>${L.heroDesc}</p>
       </section>`
    : '';

  const stepBar = state.step < 3
    ? `<div class="stepbar">
         <div class="row">
           <small><strong>${L.stepOf(Math.min(displayStep + 1, 4), 4)}</strong></small>
           <small>${L.stepFlow}</small>
         </div>
         <div class="segments" aria-hidden="true">
           ${[0, 1, 2, 3].map(i => `<i class="${i <= displayStep ? 'filled' : ''}"></i>`).join('')}
         </div>
       </div>`
    : '';

  let body = '';

  if (state.analyzing) {
    body = `
      <section class="card narrow analyzing">
        <div class="spin"></div>
        <h2>${L.anTitle}</h2>
        <p>${L.anSub}</p>

    body = `
      <h2>${L.chooseArea}</h2>
      <div class="grid two">

          <button class="choice ${sp.warm ? 'warm' : ''}" data-action="area:${sp.id}">
            <span class="icon ${sp.color}" aria-hidden="true">${sp.icon}</span>
            <span><strong>${sp.title}</strong><small>${sp.desc}</small></span>
            <span class="arrow" aria-hidden="true">↗</span>
          </button>`).join('')}
      </div>`;
  } else if (state.step === 1) {
    const sp = getArea();
    const visible = state.expanded ? sp.items : sp.items.filter(it => it.core);
    const hiddenN = sp.items.length - sp.items.filter(it => it.core).length;
    const totalPicked = state.selectedIds.length + (state.other.trim() ? 1 : 0);
    const maxHit = totalPicked >= 3;
    body = `
      <section class="card narrow">
        <span class="tag">${sp.icon} ${sp.title}</span>
        <h1>${L.step2Title}</h1>

          }).join('')}
        </div>
        ${hiddenN > 0 ? `<button class="secondary" data-action="expand" aria-expanded="${state.expanded}">${state.expanded ? L.showLess : L.showMore(hiddenN)}</button>` : ''}
        <label class="field">${L.otherLbl}
          <input class="inp" id="otherInp" maxlength="100" value="${esc(state.other)}" placeholder="${L.otherPh}" ${state.selectedIds.length >= 3 && !state.other.trim() ? 'disabled' : ''}>
        </label>
        <div class="actions">
          <button class="secondary" data-action="back">${L.back}</button>
          <button class="primary" id="btnToQ" data-action="toQ" ${totalPicked === 0 ? 'disabled' : ''}>${L.cont}</button>
        </div>
      </section>`;
  } else if (state.step === 2) {
    const qs = L.questionsByTrack[computeTrack()] || L.questionsByTrack.tatiana;
    const q = qs[state.qIdx];
    const cur = state.answers[state.qIdx] || '';
    const customVal = q.choices.includes(cur) ? '' : cur;

function logStudentEvent(trKey, isHot, quote, requested = false) {
  const tr = d().tracks[trKey];
  const existing = state.events.find(e => e.id === 'live-stud-' + trKey);
  const name = state.contact ? state.contact.name : (state.lang === 'ru' ? 'Ученик демо-курса (Вы)' : 'Demo Course Student (You)');
  const channel = state.contact ? state.contact.channel : (state.lang === 'ru' ? 'Прямо сейчас в AI-курсе' : 'Live inside AI Course');
  const label = isHot
    ? `${tr.title} · ${state.lang === 'ru' ? 'Застрял на Уроке 2' : 'Stuck at Lesson 2'}`
    : `${tr.title} · ${state.lang === 'ru' ? 'Урок 3 открыт' : 'Lesson 3 unlocked'}`;
  if (existing) {
    existing.hot = isHot;
    existing.fresh = true;
    existing.progress = isHot ? 65 : 95;
    existing.courseLabel = label;
    existing.quote = `«${quote.slice(0, 150)}${quote.length > 150 ? '…' : ''}»`;
    existing.requested = requested || existing.requested;
    existing.contacted = !isHot;
    existing.time = (state.lang === 'ru' ? 'Только что, ' : 'Just now, ') + nowTime();
  } else {
    state.events.unshift({
      id: 'live-stud-' + trKey,
      type: 'student',
      expert: trKey,
      hot: isHot,
      fresh: true,
      name,
      channel,
      lang: state.lang.toUpperCase(),
      progress: isHot ? 65 : 95,
      courseLabel: label,
      quote: `«${quote.slice(0, 150)}${quote.length > 150 ? '…' : ''}»`,
      requested,
      contacted: !isHot,
      time: (state.lang === 'ru' ? 'Только что, ' : 'Just now, ') + nowTime()
    });
  }
  saveEvents();
}

document.addEventListener('click', ev => {
  const target = ev.target.closest('[data-action]');
  if (!target) return;
  const [act, arg] = target.dataset.action.split(':');

  if (act === 'home') { state.tab = 0; render(true); return; }
  if (act === 'lang') {
    state.lang = arg;
    if (state.tab === 1 && !state.courseState[state.track].result) {
      state.track = arg === 'en' ? 'vaidile' : 'tatiana';
    }
    render();
    return;
  }
  if (act === 'tab') { state.tab = Number(arg); render(true); return; }
  if (act === 'area') {
    if (state.areaId !== arg) { state.selectedIds = []; state.other = ''; state.answers = ['', '', '']; state.expanded = false; }
    state.areaId = arg;
    state.contact = null;
    state.qIdx = 0;
    state.step = arg === 'unsure' ? 2 : 1;
    render(true);
    return;
  }
  if (act === 'expand') { state.expanded = !state.expanded; render(); return; }
  if (act === 'toQ') { state.step = 2; state.qIdx = 0; render(true); return; }
  if (act === 'back') {
    if (state.step === 2 && state.qIdx > 0) state.qIdx--;
    else if (state.step === 2 && state.areaId === 'unsure') state.step = 0;
    else state.step = Math.max(0, state.step - 1);
    render(true);
    return;
  }
  if (act === 'ans') {
    const qs = d().questionsByTrack[computeTrack()] || d().questionsByTrack.tatiana;
    state.answers[state.qIdx] = qs[state.qIdx].choices[Number(arg)];
    render();
    return;
  }
  if (act === 'nextQ') {
    if (state.qIdx < 2) { state.qIdx++; render(true); }
    else runAnalysis();
    return;
  }
  if (act === 'reset') {
    state.step = 0; state.selectedIds = []; state.other = ''; state.expanded = false;
    state.answers = ['', '', '']; state.qIdx = 0; state.contact = null;
    render(true);
    return;
  }
  if (act === 'routed-course') { state.track = expertKey(); state.tab = 1; render(true); return; }
  if (act === 'track') { state.track = arg; state.staff = false; render(); return; }
  if (act === 'staff') { state.staff = !state.staff; render(); return; }
  if (act === 'sample') {
    const sampleTxt = d().tracks[state.track].samples[Number(arg)];
    state.courseState[state.track].text = sampleTxt;
    const ta = $('lessonText');
    if (ta) { ta.value = sampleTxt; ta.focus(); }
    return;
  }
  if (act === 'book') {
    const cs = state.courseState[state.track];
    cs.requested = true;
    logStudentEvent(state.track, true, cs.text, true);
    render(false, true);
    return;
  }
  if (act === 'signal') {
    state.filterType = 'all';
    state.filterExpert = 'all';
    state.tab = 2;
    render(true);
    const el = $('ev-live-stud-' + state.track);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (act === 'contacted') {
    const item = state.events.find(e => e.id === arg);
    if (item) { item.contacted = true; item.fresh = false; saveEvents(); render(); }
    $('status').textContent = state.lang === 'ru' ? 'Связь отмечена' : 'Marked as contacted';
  }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.hasAttribute('data-priority')) {
    const id = el.dataset.priority;
    if (el.checked) {
      if (state.selectedIds.length + (state.other.trim() ? 1 : 0) < 3) state.selectedIds.push(id);
    } else {
      state.selectedIds = state.selectedIds.filter(x => x !== id);
    }
    render();
    return;
  }
  if (el.id === 'fltType') { state.filterType = el.value; render(); return; }
  if (el.id === 'fltExp') { state.filterExpert = el.value; render(); return; }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'otherInp') {
    state.other = el.value;
    const n = state.selectedIds.length + (state.other.trim() ? 1 : 0);
    if ($('pickedTxt')) $('pickedTxt').textContent = d().picked(n);
    if ($('btnToQ')) $('btnToQ').disabled = n === 0;
    return;
  }
  if (el.id === 'ownInp') {
    state.answers[state.qIdx] = el.value;
    if ($('btnNextQ')) $('btnNextQ').disabled = !el.value.trim();
    document.querySelectorAll('[data-action^="ans:"]').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
    return;
  }
  if (el.id === 'lessonText') {
    state.courseState[state.track].text = el.value;
    return;
  }
  if (el.form && el.form.id === 'contactForm') el.setCustomValidity('');
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.id === 'contactForm') {
    const L = d();
    const fd = new FormData(ev.target);
    const name = String(fd.get('name') || '').trim();
    const channel = String(fd.get('channel') || '').trim();
    const okCh = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(channel) || (/^\+?[\d ()-]+$/.test(channel) && channel.replace(/\D/g, '').length >= 6);
    if (!name || !okCh) {
      const fld = !name ? ev.target.elements.name : ev.target.elements.channel;
      fld.setCustomValidity(!name ? L.fillNameErr : L.fillContactErr);
      fld.reportValidity();
      return;
    }
    state.contact = { name, channel };
    state.events.unshift({
      id: 'lead-' + Date.now(),
      type: 'lead',
      expert: expertKey(),
      hot: false,
      fresh: true,
      name,
      channel,
      lang: state.lang.toUpperCase(),
      tags: selectedLabels(),
      detail: state.answers.filter(Boolean).join(' · '),
      contacted: false,
      time: (state.lang === 'ru' ? 'Только что, ' : 'Just now, ') + nowTime()
    });
    saveEvents();
    render(false, true);
    return;
  }

  if (ev.target.id === 'lessonForm') {
    const trKey = state.track;
    const cs = state.courseState[trKey];
    const txt = cs.text.trim();
    if (!txt) return;
    state.checking = true;
    render();

    setTimeout(() => {
      state.checking = false;
      const low = txt.toLowerCase();
      const stuckRe = /застрял|не понимаю|не знаю|тяжело|страшно|каша|долг|хаос|помоги|stuck|overwhelmed|anxious|confused|chaos|debt|don.t know|help/;
      const hasStuck = stuckRe.test(low);
      const hasNum = /\d/.test(txt);
      const concreteWords = ['недел', 'пятниц', 'понедельник', 'март', 'дн', 'мес', 'резерв', 'подушк', 'корзин', 'шаг', 'ваканси', 'подписк', 'кофе', 'цель', 'срок', 'доход', 'расход', 'week', 'friday', 'monday', 'march', 'day', 'month', 'bucket', 'cushion', 'step', 'subscription', 'coffee', 'goal', 'deadline', 'income', 'expense'];
      const hits = concreteWords.filter(w => low.includes(w)).length;
      const isStrong = !hasStuck && txt.length >= 45 && hasNum && hits >= 2;

      if (isStrong) {
        cs.result = 'pass';
        cs.passed = true;
        logStudentEvent(trKey, false, txt, false);
        render(false, true);
      } else if (hasStuck || cs.attempts >= 1) {
        cs.attempts++;
        cs.result = 'vip';
        logStudentEvent(trKey, true, txt, cs.requested);
        render(false, true);
      } else {
        cs.attempts++;
        cs.result = 'revise';
        render();
      }
    }, 600);
  }
});

loadEvents();
render();
</script>
</body>
</html>
