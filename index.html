<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Платформа проектов · Вайдиле и Татьяна</title>
<meta name="description" content="Два онлайн-проекта и единый рабочий кабинет: финансовый консалтинг и обучение Вайдиле + система прохождения Шкалы целей Татьяны." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#142e31;
  --muted:#486568;
  --green:#116851;
  --green-hover:#0d5442;
  --mint:#e5f5ed;
  --line:#dce8e5;
  --paper:#ffffff;
  --bg:#f6f9f8;
  --coral:#9b3b32;
  --coral-accent:#d57967;
  --peach:#fff0e9;
  --peach-line:#efd6cd;
  --amber-bg:#fff3dc;
  --amber-ink:#755020;
  --amber-line:#efdfbb;
  --yellow-bg:#fff6e2;
  --yellow-line:#f0dfb6;
  --blue-bg:#e8f3ff;
  --blue-ink:#245982;
  --radius:24px;
  --shadow:0 8px 26px rgba(24, 61, 53, 0.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:15.5px/1.54 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button,select,summary{cursor:pointer}
button{border:0}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{
  outline:3px solid #3682b5;
  outline-offset:3px;
}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.16;letter-spacing:-.03em}
h1{font-size:clamp(26px, 4.4vw, 48px);font-weight:750}
h2{font-size:clamp(20px, 2.3vw, 24px);font-weight:750}
h3{font-size:17.5px;font-weight:750}
p,small{color:var(--muted)}
small{font-size:13px}

.shell{width:min(100% - 32px, 1120px);margin:auto}

/* Sticky Topbar */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(246, 249, 248, 0.94);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.brandbar{
  min-height:64px;
  display:flex;
  align-items:center;
  gap:11px;
}
.brand-click{
  display:flex;
  align-items:center;
  gap:11px;
  background:none;
  padding:0;
  text-align:left;
}
.logo,.icon{display:grid;place-items:center;flex:none}
.logo{
  width:38px;
  height:38px;
  border-radius:13px;
  background:#145745;
  color:#fff;
  font-size:21px;
}
.brandbar strong,.brandbar small{display:block}
.brandbar strong{line-height:1.15;font-size:15.5px;font-weight:800;color:var(--ink)}
.brandbar small{font-size:12.2px;color:var(--muted)}

.lang{
  margin-left:auto;
  display:flex;
  padding:3px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#eef4f2;
}
.lang button{
  background:transparent;
  min-height:36px;
  padding:0 10px;
  font-size:12px;
  font-weight:750;
  border-radius:9px;
  color:var(--muted);
  transition:all .16s ease;
}
.lang .on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(20,46,49,.08)}

nav{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  background:#eaf0ee;
  border-radius:15px;
  padding:4px;
  margin-bottom:12px;
  gap:4px;
}
nav button{
  background:none;
  border-radius:11px;
  min-height:43px;
  padding:4px 6px;
  font-weight:700;
  font-size:clamp(12px, 3vw, 14px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--muted);
  transition:all .18s ease;
}
.tab-ext{display:none}
@media(min-width:600px){.tab-ext{display:inline}}
nav button:hover{color:var(--ink)}
nav .on{
  background:#fff;
  box-shadow:0 2px 8px rgba(21,53,44,.09);
  color:var(--green);
}
.count{
  display:inline-grid;
  place-items:center;
  background:#aa4437;
  color:#fff;
  border-radius:20px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  font-size:10.5px;
  font-weight:800;
  margin-left:4px;
  vertical-align:middle;
}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.count.pulse{animation:pop .5s ease 2}

main{padding:20px 0 58px}
.stack{display:grid;gap:18px}
.sub-stack{display:grid;gap:12px}

/* Hero Cards */
.hero{
  position:relative;
  isolation:isolate;
  overflow:hidden;
  padding:26px 22px;
  border-radius:28px;
  background:linear-gradient(117deg, #e9f8ee, #dff3f8 72%, #c9e8ee);
  border:1px solid #cfe9e4;
}
.hero.warm-hero{
  background:linear-gradient(120deg, #f3f9f5 0%, #eef6fa 55%, #fff5e3 100%);
  border-color:#d8e7e2;
}
.hero.cabinet-hero{
  background:linear-gradient(117deg, #e7f3f9, #ebf6f1 75%, #e2efe9);
  border-color:#cde2e0;
}
.hero h1{max-width:700px;margin:12px 0 10px;color:var(--ink)}
.hero p{max-width:580px;color:#35565a;font-size:15px}
.hero.with-art{padding-top:142px}

.compass{
  width:146px;
  aspect-ratio:1;
  position:absolute;
  right:24px;
  top:-16px;
  display:grid;
  place-items:center;
  border-radius:50%;
  background:
    repeating-conic-gradient(from 0deg, #346f6e48 0deg 1deg, transparent 1deg 15deg),
    linear-gradient(145deg, #ffffff, #a8dcd6);
  box-shadow:0 10px 22px #30716a20, inset 0 0 0 6px #ffffff88;
  transform:rotate(-12deg);
}
.compass:before{
  content:'';
  position:absolute;
  inset:13px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%, #fbffff, #ceebe6);
  border:1px solid #fff;
}
.needle{
  z-index:1;
  width:30%;
  height:72%;
  transform:rotate(40deg);
  background:linear-gradient(#16795f 50%, #77b4bd 50%);
  clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
}
.compass:after{
  content:'';
  position:absolute;
  z-index:2;
  width:9%;
  height:9%;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 6px #173e45aa;
}

.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hero-actions .primary{width:auto;min-width:210px}

/* Badges / Tags */
.tag{
  display:inline-flex;
  align-items:center;
  gap:6px;
  width:fit-content;
  max-width:100%;
  border-radius:999px;
  background:#e9f4f1;
  color:#1f5548;
  padding:5px 11px;
  font-size:12px;
  font-weight:750;
  overflow-wrap:anywhere;
}
.hero .tag{background:rgba(255,255,255,0.84);color:#1f5548}
.tag.vaidile{background:#e3f5ec;color:#116851}
.tag.tatiana{background:#fff3dc;color:#755020}
.tag.hot-tag{background:#fae6e0;color:var(--coral)}
.tag.new-tag{background:#e2f2fb;color:#1d5f86}
.tag.self-tag{background:#e6f6ed;color:#16614a}
.tag.replied-tag{background:#edf2f1;color:#3d5c5a}

/* Section Headers */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head p{margin-top:4px;font-size:14.2px}

/* Cards & Grids */
.grid{display:grid;gap:12px}
.card,.choice{
  border:1px solid var(--line);
  background:var(--paper);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.card{padding:20px;min-width:0}
.card>*+*{margin-top:12px}
.card p,.card li{overflow-wrap:anywhere}
.card.green{background:#e6f6ed;border-color:#c5e7d7}
.card.green p,.card.green li{color:#1f4d3d}
.card.peach{background:var(--peach);border-color:var(--peach-line)}
.card.peach p{color:#5e352d}
.card.yellow{background:var(--yellow-bg);border-color:var(--yellow-line)}
.card.yellow p,.card.yellow li{color:#5d441b}
.card.soft-mint{background:linear-gradient(135deg, #f4fbf8, #ffffff);border-color:#cde5dc}

.choice{
  display:flex;
  align-items:center;
  gap:13px;
  min-height:92px;
  text-align:left;
  padding:15px 16px;
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
.choice:hover,.option:hover,.check-row:hover{border-color:#72ab9a}
.choice:hover{transform:translateY(-2px)}
.choice .arrow{margin-left:auto;color:#3f695e;font-size:17px;flex:none}
.choice strong{display:block;font-size:15.8px;font-weight:750;color:var(--ink);margin-bottom:3px}
.choice small{display:block;font-size:13px;line-height:1.42}
.choice.warm{background:linear-gradient(135deg, #fffdf8, #fff6e2);border-color:var(--amber-line)}

.icon{
  height:44px;
  width:44px;
  border-radius:14px;
  background:#e3f3ee;
  color:#14664e;
  font-size:20px;
  font-weight:700;
}
.icon.blue{background:var(--blue-bg);color:var(--blue-ink)}
.icon.rose{background:#faeaf1;color:#883f62}
.icon.amber{background:var(--amber-bg);color:var(--amber-ink)}

/* Buttons */
.primary,.secondary,.option{
  border-radius:14px;
  min-height:47px;
  padding:10px 16px;
  font-weight:700;
  transition:all .16s ease;
}
.primary{background:var(--green);color:#fff;width:100%}
.primary:hover:not(:disabled){background:var(--green-hover)}
.primary.coral-btn{background:#b8493b}
.primary.coral-btn:hover:not(:disabled){background:#9c3b2f}
.secondary,.option{background:#f1f7f4;border:1px solid var(--line);color:var(--ink)}
.secondary:hover:not(:disabled){background:#e6f2ec}
.option{text-align:left;line-height:1.38}
.option.on{background:#dff3e8;border-color:#5fa389;color:#0e4737}
.btn-sm{min-height:38px;padding:7px 13px;font-size:13px;border-radius:11px}

.actions{display:flex;gap:9px;flex-wrap:wrap}
.actions>*{flex:1;min-width:140px}

/* Stepper & Progress */
.stepbar{display:grid;gap:8px;padding:0 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.segments{display:flex;gap:6px}
.segments i,.meter{height:6px;border-radius:12px;background:#dceae5;overflow:hidden}
.segments i{flex:1;transition:background .3s ease}
.segments .filled,.meter i{background:#319779}
.meter{width:100%}
.meter i{height:100%;display:block;border-radius:inherit;transition:width .4s ease}

/* Checkboxes */
.check-row{
  display:flex;
  align-items:center;
  gap:11px;
  min-height:48px;
  padding:10px 13px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#f8fbfa;
  cursor:pointer;
  transition:all .15s ease;
  user-select:none;
}
.check-row.on{background:#e4f5ec;border-color:#68ab92}
.check-row.dis{opacity:.48;cursor:not-allowed}
.check-row input{width:19px;height:19px;accent-color:var(--green);flex:none;margin:0;cursor:inherit}
.check-row span{font-size:14.4px;font-weight:600;color:var(--ink)}

/* Forms */
.form{display:grid;gap:11px}
label.field{display:grid;gap:5px;font-weight:700;font-size:13.5px;color:var(--ink)}
input.inp,textarea.inp,select.inp{
  width:100%;
  min-width:0;
  border:1px solid #bed2ce;
  border-radius:12px;
  background:#fff;
  padding:10px 13px;
  min-height:45px;
}
textarea.inp{resize:vertical;min-height:96px;line-height:1.5}
.form-two{display:grid;gap:10px}

/* Articles Accordion (Vaidile Info Hub) */
.article-card{
  border:1px solid var(--line);
  background:#fff;
  border-radius:20px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.article-card summary{
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  font-weight:750;
  font-size:15.5px;
  color:var(--ink);
}
.article-card summary::-webkit-details-marker{display:none}
.article-card summary .plus{
  width:28px;height:28px;border-radius:9px;background:#eaf4f1;color:var(--green);
  display:grid;place-items:center;flex:none;font-size:16px;font-weight:800;
}
.article-card[open] summary .plus{background:var(--green);color:#fff}
.article-body{margin-top:12px;padding-top:12px;border-top:1px solid #ecf2f0;font-size:14.2px;color:var(--muted);display:grid;gap:8px}

/* Packages (Vaidile 4 Offers) */
.pkg-card{
  border:1px solid var(--line);
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  gap:9px;
}
.pkg-card.featured{
  background:linear-gradient(145deg, #f3fbf7, #ffffff);
  border-color:#78b79e;
}
.pkg-price{font-size:18px;font-weight:800;color:var(--green)}
.pkg-card p{font-size:13.8px;flex:1}

/* Quick Demo Helpers (subtle) */
.demo-strip{
  background:#f3f7f6;
  border:1px dashed #c4d7d2;
  border-radius:14px;
  padding:11px 13px;
  display:grid;
  gap:8px;
}
.demo-strip small{font-size:12px;font-weight:700;color:#4a6b68}
.scen-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:7px}
@media(max-width:520px){.scen-grid{grid-template-columns:1fr}}
.scen-btn{
  border-radius:11px;
  min-height:38px;
  padding:7px 9px;
  font-size:12.4px;
  font-weight:700;
  background:#fff;
  border:1px solid var(--line);
  color:var(--ink);
  transition:all .15s;
}
.scen-btn:hover{border-color:#68ab92;background:#e6f5ee}
.scen-btn.st:hover{border-color:#d57967;background:#fff0e9;color:var(--coral)}

/* Interactive Expense Calculator inside Vaidile */
.calc-result{
  padding:14px 16px;
  border-radius:16px;
  background:#e6f6ed;
  border:1px solid #c5e7d7;
  color:#184b3a;
  font-size:14.2px;
}
.calc-result strong{font-size:20px;color:var(--green)}

/* Direct Contact Channels */
.chan-grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:8px}
@media(max-width:520px){.chan-grid{grid-template-columns:1fr}}
.chan-pill{
  border-radius:13px;
  padding:10px 12px;
  background:#f4f9f7;
  border:1px solid var(--line);
  font-size:13px;
  font-weight:700;
  text-align:center;
  color:var(--ink);
}
.chan-pill.on{background:#dff3e8;border-color:#5fa389;color:#0e4737}

/* Scale Map Result (Tatiana) */
.scale-map{
  display:grid;
  gap:10px;
  background:linear-gradient(135deg, #f3fbf8, #ffffff);
  border:1px solid #cce3db;
  border-radius:18px;
  padding:16px;
}
.scale-row{
  display:flex;
  gap:12px;
  align-items:flex-start;
  padding-bottom:10px;
  border-bottom:1px solid #e7f0ed;
}
.scale-row:last-child{padding-bottom:0;border-bottom:0}
.scale-num{
  width:28px;height:28px;border-radius:9px;background:var(--green);color:#fff;
  display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;
}
.scale-row strong{display:block;font-size:13.8px;color:var(--ink)}
.scale-row span{display:block;font-size:13.6px;color:var(--muted);margin-top:2px}

/* Back-Office Cabinet (Tab 3) */
.cab-switch{
  display:grid;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:8px;
}
@media(max-width:560px){.cab-switch{grid-template-columns:1fr}}
.kpis{grid-template-columns:repeat(2, minmax(0, 1fr))}
.kpis strong{display:block;font-size:28px;line-height:1.15;color:var(--ink);margin-top:4px}
.kpis .card{padding:14px 16px}
.kpis .kpi-hot strong{color:var(--coral)}
.kpis .kpi-green strong{color:var(--green)}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.filters{grid-template-columns:1fr}}

.hot{border-left:4px solid var(--coral-accent);background:linear-gradient(135deg, #fffaf8 0%, #ffffff 36%)}
.fresh-card{border-left:4px solid #319779;background:linear-gradient(135deg, #f3fbf8 0%, #ffffff 40%)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
blockquote{
  margin:8px 0;
  color:var(--muted);
  border-left:2.5px solid #c7d9d4;
  padding-left:11px;
  font-size:13.8px;
  overflow-wrap:anywhere;
}
.hot blockquote{border-left-color:#d6a494}

.reply-box{
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #e9f1ee;
  display:grid;
  gap:8px;
}
.reply-history{
  background:#eef7f3;
  border:1px solid #cde5db;
  border-radius:13px;
  padding:10px 13px;
  font-size:13.4px;
  color:#194b3b;
}
.reply-history small{display:block;font-size:11.5px;color:#3d6b5c;margin-bottom:3px;font-weight:700}
.quick-replies{display:flex;gap:6px;flex-wrap:wrap}
.qr-btn{
  border-radius:999px;
  padding:5px 11px;
  font-size:12px;
  font-weight:700;
  background:#eef5f2;
  border:1px solid #cfe0da;
  color:var(--ink);
}
.qr-btn:hover{background:#dff0e8;border-color:#72ab9a}

.disclaimer{
  font-size:12.3px;
  color:var(--muted);
  padding:12px 14px;
  background:#f1f6f5;
  border-radius:14px;
  border:1px solid var(--line);
}
.foot{
  text-align:center;
  font-size:12.5px;
  color:var(--muted);
  padding:14px 10px 0;
  border-top:1px solid var(--line);
}
ol,ul{padding-left:20px;margin:0}
li+li{margin-top:6px}
.break{overflow-wrap:anywhere}
.visually-hidden{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}

@media(min-width:760px){
  main{padding-top:28px}
  .brandbar{min-height:72px}
  nav{width:min(100%, 660px)}
  .hero{padding:36px 40px}
  .hero.with-art{padding:44px 310px 44px 40px}
  .compass{width:214px;right:50px;top:50%;translate:0 -50%}
  .grid.two{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .grid.three{grid-template-columns:repeat(3, minmax(0, 1fr))}
  .grid.four{grid-template-columns:repeat(2, minmax(0, 1fr))}
  .columns{grid-template-columns:1fr 1fr;align-items:start}
  .kpis{grid-template-columns:repeat(4, minmax(0, 1fr))}
  .narrow{max-width:760px;width:100%;margin-inline:auto}
  .form-two{grid-template-columns:1fr 1fr}
}
@media(min-width:1040px){
  .grid.four{grid-template-columns:repeat(4, minmax(0, 1fr))}
}
</style>
</head>
<body>
<header class="top">
  <div class="shell">
    <div class="brandbar">
      <button class="brand-click" data-action="tab:0">
        <span class="logo" aria-hidden="true">✦</span>
        <span>
          <strong id="brand">Платформа проектов</strong>
          <small id="sub">Вайдиле · Татьяна · Кабинет управления</small>
        </span>
      </button>
      <div class="lang" aria-label="Language" id="lang"></div>
    </div>
    <nav id="nav" aria-label="Projects"></nav>
  </div>
</header>

<main class="shell" id="main"></main>
<div class="visually-hidden" role="status" id="status"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowTime = () => { const n = new Date(); return `${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`; };

const DATA = {
  ru: {
    brand: 'Платформа проектов',
    sub: 'Два самостоятельных бизнеса и рабочий кабинет',
    tabs: [
      ['1. Вайдиле', ' · Финансы'],
      ['2. Татьяна', ' · Шкала целей'],
      ['3. Кабинет', '']
    ],

    /* ========= PROJECT 1: VAIDILE ========= */
    v: {

function render(scrollTop = false, pulse = false) {
  const txt = L();
  document.documentElement.lang = state.lang;
  $('brand').textContent = txt.brand;

  $('lang').innerHTML = ['ru', 'en'].map(code =>
    `<button class="${state.lang === code ? 'on' : ''}" data-action="lang:${code}" aria-pressed="${state.lang === code}">${code.toUpperCase()}</button>`
  ).join('');

  const pCnt = pendingCount();
  $('nav').innerHTML = txt.tabs.map(([base, ext], i) => {
    const badge = i === 2 && pCnt ? `<span class="count ${pulse ? 'pulse' : ''}">${pCnt}</span>` : '';

    return `<button class="${state.tab === i ? 'on' : ''}" data-action="tab:${i}" aria-pressed="${state.tab === i}">${base}${extHtml}${badge}</button>`;
  }).join('');

function renderCabinet() {
  const c = L().c;
  const scoped = state.cabExpert === 'all' ? state.records : state.records.filter(r => r.expert === state.cabExpert);
  const cntNew = scoped.filter(r => r.status === 'need_expert').length;
  const cntActive = scoped.filter(r => r.progress > 0).length;
  const cntNeed = scoped.filter(r => r.status === 'need_expert').length;
  const cntSelf = scoped.filter(r => r.status === 'self').length;

  const q = state.cabSearch.trim().toLowerCase();
  const visible = scoped.filter(r => {
    const okSt = state.cabStatus === 'all' || r.status === state.cabStatus;
    const okQ = !q || [r.name, r.program, r.summary, ...(r.answers || [])].join(' ').toLowerCase().includes(q);
    return okSt && okQ;
  });

  const expName = k => k === 'vaidile' ? (state.lang === 'ru' ? 'Вайдиле' : 'Vaidilė') : (state.lang === 'ru' ? 'Татьяна' : 'Tatiana');

  return `
    <div class="stack">
      <section class="hero cabinet-hero">
        <span class="tag">${c.chip}</span>
        <h1>${c.h1}</h1>
        <p>${c.sub}</p>
      </section>

      <div class="cab-switch">
        ${c.views.map(([k, lbl]) => `<button class="option ${state.cabExpert === k ? 'on' : ''}" data-action="cabExp:${k}" aria-pressed="${state.cabExpert === k}"><strong>${lbl}</strong></button>`).join('')}

      <div class="grid kpis">
        <section class="card"><small>${c.kpis[0]}</small><strong>${scoped.length}</strong></section>
        <section class="card"><small>${c.kpis[1]}</small><strong>${cntActive}</strong></section>
        <section class="card kpi-hot"><small>${c.kpis[2]}</small><strong>${cntNeed}</strong></section>
        <section class="card kpi-green"><small>${c.kpis[3]}</small><strong>${cntSelf}</strong></section>
      </div>

      <section class="card">
        <div class="filters">
          <label class="field">${c.fltStatusLbl}
            <select class="inp" id="cabStSel">
              ${c.fltStatuses.map(([v, l]) => `<option value="${v}" ${state.cabStatus === v ? 'selected' : ''}>${l}</option>`).join('')}
            </select>
          </label>
          <label class="field">${c.fltSearchLbl}
            <input class="inp" id="cabSearchInp" value="${esc(state.cabSearch)}" placeholder="${c.fltSearchPh}">
          </label>
        </div>
      </section>

      <div class="grid two">
        ${visible.length ? visible.map(r => {
          const isNeed = r.status === 'need_expert';

          const qrs = c.quickReplies[r.expert] || [];
          const draft = state.replyDrafts[r.id] || '';

          return `
            <article class="card ${isNeed ? 'hot' : (r.fresh ? 'fresh-card' : '')}" id="rec-${r.id}">
              <div class="tags">
                ${statusTag}
                <span class="tag ${r.expert}">${expName(r.expert)}</span>
              </div>
              <div>
                <h3 class="break">${esc(r.name)}</h3>
                <small style="display:block;margin-top:3px">${esc(r.contact)} · ${esc(r.time)} · [${r.lang}]</small>

/* ==================== INTERACTIONS ==================== */
function pushRecord(rec) {
  state.records.unshift(rec);
  saveRecords();
}

document.addEventListener('click', ev => {
  const btn = ev.target.closest('[data-action]');
  if (!btn) return;
  const parts = btn.dataset.action.split(':');
  const act = parts[0], arg = parts[1], arg2 = parts[2];

  if (act === 'lang') {
    state.lang = arg;
    render();
    return;
  }
  if (act === 'tab') {
    state.tab = Number(arg);
    render(true);
    return;
  }
  if (act === 'openCab') {
    state.cabExpert = arg || 'all';
    state.cabStatus = 'all';
    state.tab = 2;
    render(true);
    return;
  }

  /* Vaidile interactions */
  if (act === 'scrollCalc') { $('vaidileCalc')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (act === 'scrollDirect') { $('vaidileDirect')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (act === 'vGetTracker') {
    const monthly = Math.round(state.vCoffee * 4.3 + state.vSubs);
    state.vTrackerSent = true;
    pushRecord({
      id: 'v-trk-' + Date.now(),
      expert: 'vaidile',
      status: 'self',
      fresh: true,
      name: state.lang === 'ru' ? 'Посетитель портала (Трекер)' : 'Portal Visitor (Tracker)',
      contact: state.lang === 'ru' ? 'Скачан бесплатный трекер' : 'Downloaded free tracker',
      lang: state.lang.toUpperCase(),
      program: state.lang === 'ru' ? 'Трекер расходов на 30 дней' : '30-Day Expense Tracker',
      progress: 25,
      summary: state.lang === 'ru'
        ? `Посчитал утечки на калькуляторе (~$${monthly}/мес) и забрал бесплатный трекер.`
        : `Calculated monthly leaks (~$${monthly}/mo) and unlocked the free tracker.`,
      answers: [
        state.lang === 'ru' ? `Кофе/перекусы: $${state.vCoffee}/нед · Подписки: $${state.vSubs}/мес` : `Coffee/snacks: $${state.vCoffee}/wk · Subscriptions: $${state.vSubs}/mo`
      ],
      replies: [],
      time: nowTime()
    });
    render(false, true);
    return;
  }
  if (act === 'vSample') {
    state.vLessonText = L().v.samples[Number(arg)];
    const ta = $('vLessonInp');
    if (ta) { ta.value = state.vLessonText; ta.focus(); }
    return;
  }
  if (act === 'vPickPkg') {
    state.vSelectedPkg = parts.slice(1).join(':');
    state.vDirectSent = '';
    render();
    $('vaidileDirect')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (act === 'vChan') { state.vChannel = Number(arg); render(); return; }

  /* Tatiana Scale interactions */
  if (act === 'tScale') {
    if (state.tScaleId !== arg) { state.tSelectedIds = []; state.tOther = ''; state.tExpanded = false; }
    state.tScaleId = arg;
    state.tNeedRefine = false;
    state.tSavedName = '';
    state.tStep = arg === 'unsure' ? 2 : 1;
    render(true);
    return;
  }
  if (act === 'tExpand') { state.tExpanded = !state.tExpanded; render(); return; }
  if (act === 'tBack') {
    if (state.tStep === 2 && state.tScaleId === 'unsure') state.tStep = 0;
    else state.tStep = Math.max(0, state.tStep - 1);
    render(true);
    return;
  }
  if (act === 'tGoQ') { state.tStep = 2; state.tNeedRefine = false; render(true); return; }
  if (act === 'tPickQ1') { state.tQ1 = L().t.q1Opts[Number(arg)]; render(); return; }
  if (act === 'tPickQ3') { state.tQ3 = arg; render(); return; }
  if (act === 'tDemo') {
    const idx = Number(arg);
    state.tQ1 = L().t.q1Opts[idx === 2 ? 3 : 0];
    state.tQ2 = L().t.demoSamples[idx];
    state.tQ3 = idx === 2 ? 'personal' : 'self';
    state.tNeedRefine = false;
    render();
    return;
  }
  if (act === 'tReset') {
    state.tStep = 0; state.tSelectedIds = []; state.tOther = ''; state.tQ1 = ''; state.tQ2 = '';
    state.tQ3 = 'self'; state.tNeedRefine = false; state.tSavedName = '';
    render(true);
    return;
  }

  /* Cabinet interactions */
  if (act === 'cabExp') { state.cabExpert = arg; render(); return; }
  if (act === 'qr') {
    const rec = state.records.find(r => r.id === arg);
    if (rec) {
      const qtxt = (L().c.quickReplies[rec.expert] || [])[Number(arg2)] || '';
      state.replyDrafts[rec.id] = qtxt;
      const ta = document.querySelector(`[data-draft="${rec.id}"]`);
      if (ta) { ta.value = qtxt; ta.focus(); }
    }
  }
});

document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'rngCoffee' || el.id === 'rngSubs') {
    if (el.id === 'rngCoffee') { state.vCoffee = Number(el.value); if ($('lblCoffee')) $('lblCoffee').textContent = '$' + state.vCoffee; }
    else { state.vSubs = Number(el.value); if ($('lblSubs')) $('lblSubs').textContent = '$' + state.vSubs; }
    const m = Math.round(state.vCoffee * 4.3 + state.vSubs);
    if ($('calcOut')) $('calcOut').innerHTML = L().v.calcRes(m, m * 12);
    return;
  }
  if (el.id === 'vLessonInp') { state.vLessonText = el.value; return; }
  if (el.id === 'tOtherInp') {
    state.tOther = el.value;
    const total = state.tSelectedIds.length + (state.tOther.trim() ? 1 : 0);
    if ($('tPickedTxt')) $('tPickedTxt').textContent = L().t.picked(total);
    if ($('tToStep2')) $('tToStep2').disabled = total === 0;
    return;
  }
  if (el.id === 'tQ2Inp') { state.tQ2 = el.value; return; }
  if (el.id === 'cabSearchInp') { state.cabSearch = el.value; render(); $('cabSearchInp')?.focus(); return; }
  if (el.hasAttribute('data-draft')) { state.replyDrafts[el.dataset.draft] = el.value; }
});

document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.hasAttribute('data-tprio')) {
    const id = el.dataset.tprio;
    if (el.checked) {
      if (state.tSelectedIds.length + (state.tOther.trim() ? 1 : 0) < 3) state.tSelectedIds.push(id);
    } else {
      state.tSelectedIds = state.tSelectedIds.filter(x => x !== id);
    }
    render();
    return;
  }
  if (el.id === 'cabStSel') { state.cabStatus = el.value; render(); }
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  const form = ev.target;

  /* Vaidile Lesson Check */
  if (form.id === 'vLessonForm') {
    const txt = state.vLessonText.trim();
    if (!txt) return;
    const low = txt.toLowerCase();
    const stuck = /страшн|долг|хаос|застрял|не понимаю|тяжело|anxious|debt|chaos|stuck|heavy|don.t know/.test(low);
    const hasNum = /\d/.test(txt);
    const hits = ['кофе','подписк','подушк','резерв','корзин','рост','мес','coffee','subscription','cushion','bucket','growth','month','mo'].filter(w => low.includes(w)).length;

    if (!stuck && txt.length >= 42 && hasNum && hits >= 2) {
      state.vLessonResult = 'pass';
      pushRecord({
        id: 'v-pass-' + Date.now(),
        expert: 'vaidile',
        status: 'self',
        fresh: true,
        name: state.lang === 'ru' ? 'Ученик курса Вайдиле' : 'Vaidilė Course Student',
        contact: state.lang === 'ru' ? 'Онлайн-курс · Урок 1' : 'Text Course · Lesson 1',
        lang: state.lang.toUpperCase(),
        program: state.lang === 'ru' ? 'Заочный курс · Урок 2 открыт' : 'Text Course · Lesson 2 Unlocked',
        progress: 65,
        summary: state.lang === 'ru' ? 'Успешно прошёл практику Урока 1 — идёт самостоятельно.' : 'Passed Lesson 1 audit — progressing independently.',
        answers: [txt],
        replies: [],
        time: nowTime()
      });
      render(false, true);
    } else if (stuck || state.vLessonAttempts >= 1) {
      state.vLessonAttempts++;
      state.vLessonResult = 'stuck';
      pushRecord({
        id: 'v-stuck-' + Date.now(),
        expert: 'vaidile',
        status: 'need_expert',
        fresh: true,
        name: state.lang === 'ru' ? 'Ученик заочного курса (запрос помощи)' : 'Text Course Student (Needs Help)',
        contact: state.lang === 'ru' ? 'Урок 1 · Предложена 15-мин встреча' : 'Lesson 1 · Offered 15-min call',
        lang: state.lang.toUpperCase(),
        program: state.lang === 'ru' ? 'Заочный курс · Застрял на Уроке 1' : 'Text Course · Stuck on Lesson 1',
        progress: 35,
        summary: state.lang === 'ru' ? 'Ученику сложно разобраться в счетах одному — рекомендована личная встреча с Вайдиле.' : 'Student feels overwhelmed by statements — recommended 1-on-1 intro call with Vaidilė.',
        answers: [txt],
        replies: [],
        time: nowTime()
      });
      render(false, true);
    } else {
      state.vLessonAttempts++;
      state.vLessonResult = 'revise';
      render();
    }
    return;
  }

  /* Vaidile Direct Contact Form */
  if (form.id === 'vDirectForm') {
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    const contact = String(fd.get('contact') || '').trim();
    const msg = String(fd.get('msg') || '').trim();
    if (!name || !contact) return;
    const chLabel = L().v.channels[state.vChannel];
    pushRecord({
      id: 'v-dir-' + Date.now(),
      expert: 'vaidile',
      status: 'need_expert',
      fresh: true,
      name,
      contact,
      lang: state.lang.toUpperCase(),
      program: `${state.lang === 'ru' ? 'Прямая связь' : 'Direct Inquiry'} · ${chLabel}`,
      progress: 20,
      summary: msg || (state.lang === 'ru' ? `Запросил(а) связь с Вайдиле (${chLabel}).` : `Requested direct contact with Vaidilė (${chLabel}).`),
      answers: [
        `${state.lang === 'ru' ? 'Канал' : 'Channel'}: ${chLabel}`,
        msg ? `${state.lang === 'ru' ? 'Сообщение' : 'Message'}: ${msg}` : ''
      ].filter(Boolean),
      replies: [],
      time: nowTime()
    });
    state.vDirectSent = name;
    render(false, true);
    return;
  }

  /* Tatiana Scale Questions Evaluation */
  if (form.id === 'tQuestionsForm') {
    const txt = state.tQ2.trim();
    if (!txt) return;
    const low = txt.toLowerCase();
    const stuck = /застрял|не понимаю|не знаю|каша|тяжело|ступор|stuck|cluttered|heavy|don.t know/.test(low);
    const hasConcrete = /\d/.test(txt) && txt.length >= 42;

    if (state.tQ3 === 'personal' || stuck || state.tScaleId === 'business') {
      state.tNeedRefine = false;
      state.tNeedsTatiana = true;
      state.tStep = 3;
      render(true);
    } else if (!hasConcrete && !state.tNeedRefine) {
      state.tNeedRefine = true;
      render();
    } else {
      state.tNeedRefine = false;
      state.tNeedsTatiana = !hasConcrete;
      state.tStep = 3;
      render(true);
    }
    return;
  }

  /* Tatiana Save Scale & Push to Cabinet */
  if (form.id === 'tSaveForm') {
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    const contact = String(fd.get('contact') || '').trim();
    if (!name || !contact) return;
    const sc = getScale();
    const needsT = state.tNeedsTatiana;
    pushRecord({
      id: 't-scale-' + Date.now(),
      expert: 'tatiana',
      status: needsT ? 'need_expert' : 'self',
      fresh: true,
      name,
      contact,
      lang: state.lang.toUpperCase(),
      program: `${sc.title} · ${needsT ? (state.lang === 'ru' ? 'Нужно подключить Татьяну' : 'Needs Tatiana 1-on-1') : (state.lang === 'ru' ? 'Урок 1 открыт (сам)' : 'Lesson 1 open (self-paced)')}`,
      progress: needsT ? 45 : 60,
      summary: needsT
        ? (state.lang === 'ru' ? 'Прошёл диагностику Шкалы — рекомендуется личное подключение Татьяны.' : 'Completed Scale intake — 1-on-1 connection with Tatiana recommended.')
        : (state.lang === 'ru' ? 'Собрал чёткую Шкалу целей — идёт самостоятельно по Уроку 1.' : 'Built a clear Goal Scale — moving independently into Lesson 1.'),
      answers: [
        `${state.lang === 'ru' ? 'Шкала' : 'Scale'}: ${sc.badge} (${sc.title})`,
        `${state.lang === 'ru' ? 'Приоритеты' : 'Priorities'}: ${tChosenLabels().join(', ')}`,
        `${state.lang === 'ru' ? 'Что тормозит' : 'Bottleneck'}: ${state.tQ1 || L().t.q1Opts[0]}`,
        `${state.lang === 'ru' ? 'Цель и первый шаг' : 'Goal & first step'}: ${state.tQ2}`
      ],
      replies: [],
      time: nowTime()
    });
    state.tSavedName = name;
    render(false, true);
    return;
  }

  /* Cabinet Direct Reply Form */
  if (form.hasAttribute('data-reply-id')) {
    const recId = form.dataset.replyId;
    const rec = state.records.find(r => r.id === recId);
    const msg = (state.replyDrafts[recId] || '').trim();
    if (!rec || !msg) return;
    rec.replies = rec.replies || [];
    rec.replies.push({ text: msg, time: nowTime() });
    rec.status = 'replied';
    rec.fresh = false;
    state.replyDrafts[recId] = '';
    saveRecords();
    $('status').textContent = state.lang === 'ru' ? 'Ответ отправлен клиенту' : 'Reply sent to client';
    render();
  }
});

loadRecords();
render();
</script>
</body>
</html>
